<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: transparent;
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    user-select: none;
    cursor: default;
  }
  #panel {
    width: 240px;
    padding: 7px;
    border-radius: 14px;
    background: rgba(17, 24, 40, 0.93);
    border: 1px solid rgba(255, 255, 255, 0.10);
    box-shadow: 0 18px 46px rgba(0, 0, 0, 0.46), 0 2px 8px rgba(0, 0, 0, 0.28);
    backdrop-filter: blur(18px) saturate(1.15);
    color: #e6edfb;
    font-size: 13px;
    max-height: 560px;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.18) transparent;
  }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.16); border-radius: 3px; }
  #panel::-webkit-scrollbar-track { background: transparent; }

  .head {
    padding: 8px 10px 9px;
    margin-bottom: 3px;
  }
  .head .mood {
    font-size: 12.5px;
    color: #cfe0ff;
    font-weight: 600;
    letter-spacing: .2px;
  }
  .head .cause {
    margin-top: 3px;
    font-size: 11px;
    color: #7e90ab;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .sep { height: 1px; margin: 6px 8px; background: rgba(255,255,255,0.07); }

  .group-title {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 12.5px;
    color: #b3c5dd;
    cursor: pointer;
    transition: background .12s ease, color .12s ease;
  }
  .group-title:hover { background: rgba(96, 156, 255, 0.14); color: #e6f0ff; }
  .group-title .arrow {
    margin-left: auto;
    font-size: 9px;
    color: #7d92ad;
    transition: transform .16s ease;
  }
  .group.open .group-title { color: #cfe2fb; }
  .group.open .group-title .arrow { color: #6aa8ff; }
  .group.open .group-title .arrow { transform: rotate(90deg); }
  .group-body { display: none; }
  .group.open .group-body { display: block; }

  .item {
    position: relative;
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px;
    border-radius: 8px;
    color: #dbe5f6;
    cursor: pointer;
    transition: background .12s ease, color .12s ease;
  }
  .item:hover { background: rgba(96, 156, 255, 0.16); color: #fff; }
  .item:active { background: rgba(96, 156, 255, 0.26); }
  .item .label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .dot {
    width: 7px; height: 7px; border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.28);
    flex: none;
  }
  .item.on .dot { background: #6aa8ff; border-color: #6aa8ff; box-shadow: 0 0 8px rgba(106,168,255,.7); }
  .item.on .label { color: #cfe4ff; }
  .item .check {
    color: #6aa8ff; font-size: 12px; opacity: 0;
  }
  .item.on .check { opacity: 1; }
  .item .badge {
    font-size: 10px; color: #7f8ea8;
    padding: 1px 5px; border-radius: 4px;
    background: rgba(255,255,255,0.06);
  }
  .item.sub .label { padding-left: 2px; }
  .item .icon { width: 15px; text-align: center; font-size: 12.5px; opacity: .85; flex: none; }

  .danger:hover { background: rgba(255, 92, 92, 0.18); color: #ffd9d9; }
</style>
</head>
<body>
<div id="panel"></div>
<script>
  (function () {
    'use strict';
    var panel = document.getElementById('panel');
    var api = window.NonoMenu;

    function el(tag, cls, text) {
      var d = document.createElement(tag);
      if (cls) d.className = cls;
      if (text !== undefined) d.textContent = text;
      return d;
    }

    function renderItem(it) {
      var row = el('div', 'item' + (it.on ? ' on' : '') + (it.danger ? ' danger' : ''));
      if (it.icon) row.appendChild(el('span', 'icon', it.icon));
      row.appendChild(el('span', 'label', it.label));
      if (it.badge) row.appendChild(el('span', 'badge', it.badge));
      if (it.kind === 'radio') row.appendChild(el('span', 'dot'));
      if (it.kind === 'check') row.appendChild(el('span', 'check', '✓'));
      row.addEventListener('click', function (e) {
        e.stopPropagation();
        api.click(it.id, !it.on);
      });
      return row;
    }

    function renderGroup(g) {
      var box = el('div', 'group' + (g.open ? ' open' : ''));
      var t = el('div', 'group-title');
      t.appendChild(el('span', '', g.label));
      t.appendChild(el('span', 'arrow', '▶'));
      t.addEventListener('click', function (e) {
        e.stopPropagation();
        box.classList.toggle('open');
        api.resize(document.getElementById('panel').offsetHeight + 8);
      });
      box.appendChild(t);
      var body = el('div', 'group-body');
      (g.items || []).forEach(function (it) { body.appendChild(renderItem(it)); });
      box.appendChild(body);
      return box;
    }

    function render(model) {
      panel.innerHTML = '';
      if (model.mood) {
        var h = el('div', 'head');
        h.appendChild(el('div', 'mood', '她现在：' + model.mood));
        if (model.cause) h.appendChild(el('div', 'cause', model.cause));
        panel.appendChild(h);
      }
      (model.items || []).forEach(function (it) {
        if (it.type === 'sep') panel.appendChild(el('div', 'sep'));
        else if (it.type === 'group') panel.appendChild(renderGroup(it));
        else panel.appendChild(renderItem(it));
      });
      // 渲染完把真实高度报给主进程，窗口跟着内容收缩
      requestAnimationFrame(function () {
        api.resize(panel.offsetHeight + 8);
      });
    }

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') api.close();
    });
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    api.onModel(render);
    api.ready();
  })();
</script>
</body>
</html>
